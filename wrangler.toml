name = "aether"
main = ".open-next/worker.js"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# Serve Next.js static assets (CSS/JS/images) from the OpenNext build output.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "aether"

# Public Turnstile site key — exposed to the client by design; read server-side
# by verifyTurnstile() so enforcement activates only when both keys are present.
[vars]
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEJsMbR9tqD7cn3k"

# Workers AI binding for automated NSFW screening of uploaded images
# (classifyImage in src/lib/nsfw.ts). Optional: without it, uploads are
# never scanned and the feature degrades to report-only.
ai = { binding = "AI" }

[[d1_databases]]
binding = "DB"
database_name = "aether-messages"
database_id = "96ec05bf-50f6-4843-80c1-53f33b17bb2b"
